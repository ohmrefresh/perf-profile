version: "3.9"

# Production override — use an external Prometheus.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  prometheus-mcp:
    image: ${MCP_IMAGE:-prometheus-mcp:latest}
    environment:
      PROMETHEUS_URL:        ${PROMETHEUS_URL}          # required — set in .env.prod
      PROMETHEUS_TIMEOUT_MS: ${PROMETHEUS_TIMEOUT_MS:-10000}
      MAX_CONCURRENT:        ${MAX_CONCURRENT:-4}
      LOG_LEVEL:             ${LOG_LEVEL:-warn}
      NODE_ENV:              production
    deploy:
      replicas: ${MCP_REPLICAS:-1}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus:   "0.5"
          memory: "256M"
        reservations:
          cpus:   "0.1"
          memory: "128M"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Disable local prometheus in prod — using external
  prometheus:
    deploy:
      replicas: 0
